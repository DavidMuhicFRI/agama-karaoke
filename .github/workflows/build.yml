name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Probe NetEase API
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          Q="Welcome to the DCC Nothing But Thieves"
          probe() { echo "::notice title=$1::$(echo "$2" | head -c 350 | tr '\n' ' ')"; }
          probe get "$(curl -s -G -A "$UA" -e https://music.163.com/ --data-urlencode "s=$Q" -d type=1 -d limit=2 https://music.163.com/api/search/get)"
          probe cloudsearch "$(curl -s -G -A "$UA" -e https://music.163.com/ --data-urlencode "s=$Q" -d type=1 -d limit=2 https://music.163.com/api/cloudsearch/pc)"
          probe pc-post "$(curl -s -A "$UA" -e https://music.163.com/ --data-urlencode "s=$Q" -d type=1 -d limit=2 -d offset=0 https://music.163.com/api/search/pc)"
          probe web-post "$(curl -s -A "$UA" -e https://music.163.com/ --data-urlencode "s=$Q" -d type=1 -d limit=2 -d offset=0 https://music.163.com/api/search/get/web)"
          probe web-cookie "$(curl -s -G -A "$UA" -e https://music.163.com/ -b "appver=2.0.2; os=pc" --data-urlencode "s=$Q" -d type=1 -d limit=2 https://music.163.com/api/search/get/web)"
          probe lyric "$(curl -s -A "$UA" -e https://music.163.com/ 'https://music.163.com/api/song/lyric?id=1901371647&lv=1&kv=1&tv=-1')"

      - name: Build
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log || {
            grep -E "^e: " build.log | head -20 | while read -r line; do echo "::error::$line"; done
            exit 1
          }
          cp app/build/outputs/apk/release/app-release.apk karaoke.apk

      - uses: actions/upload-artifact@v4
        with:
          name: karaoke-apk
          path: karaoke.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: karaoke.apk
          make_latest: true
