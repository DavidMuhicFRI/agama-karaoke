name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Probe NetEase API
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          S=$(curl -s -G -A "$UA" -e https://music.163.com/ --data-urlencode "s=Welcome to the DCC Nothing But Thieves" -d type=1 -d limit=3 -d offset=0 https://music.163.com/api/search/get/web)
          echo "::notice title=search::$(echo "$S" | jq -c '[.code, (.result.songs // [] | map({id, name, a: (.artists|map(.name)), duration}))]' | head -c 600)"
          ID=$(echo "$S" | jq -r '.result.songs[0].id // empty')
          L=$(curl -s -A "$UA" -e https://music.163.com/ "https://music.163.com/api/song/lyric?id=$ID&lv=1&kv=1&tv=-1")
          echo "::notice title=lyric::$(echo "$L" | jq -r '.lrc.lyric // .' | head -c 400 | tr '\n' '|')"

      - name: Build
        run: |
          gradle :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk karaoke.apk

      - uses: actions/upload-artifact@v4
        with:
          name: karaoke-apk
          path: karaoke.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: karaoke.apk
          make_latest: true
